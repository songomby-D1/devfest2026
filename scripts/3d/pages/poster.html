<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Poster renderer</title>
    <script>
      self.ModelViewerElement = {
        dracoDecoderLocation:
          '/node_modules/three/examples/jsm/libs/draco/gltf/',
      };
    </script>
    <script
      type="module"
      src="/node_modules/@google/model-viewer/dist/model-viewer.min.js"
    ></script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      model-viewer {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <model-viewer
      id="viewer"
      tone-mapping="neutral"
      shadow-intensity="1"
      alt="Scanned artwork"
    ></model-viewer>
    <script type="module">
      import { toBase64 } from '/base64.js';

      const viewer = document.getElementById('viewer');
      viewer.addEventListener('load', () => (window.modelState = 'loaded'));
      viewer.addEventListener('error', (event) => {
        window.modelState = 'failed';
        window.modelError = String(event.detail?.sourceError ?? event.type);
      });
      viewer.src = '/model.glb';

      window.renderPoster = async () => {
        const blob = await viewer.toBlob({
          mimeType: 'image/webp',
          qualityArgument: 0.85,
          idealAspect: true,
        });
        return toBase64(await blob.arrayBuffer());
      };
    </script>
  </body>
</html>
