# Local stack. Each app or service owner maintains its own entry.

services:
  # NFT service (owner: salandri-42). See apps/backend/nft/nft_context.md.
  # No published port: the gateway relays its read-only routes (§10.4).
  nft-service:
    build:
      context: .
      dockerfile: apps/backend/nft/Dockerfile
      target: development
    restart: unless-stopped
    env_file:
      - path: apps/backend/nft/.env
        required: true
    environment:
      MEDIA_ROOT: /data/media
    volumes:
      # Shared media, read-only for NFT. Pending decision E5 (volume or S3).
      - media:/data/media:ro
    networks: [internal_net, egress_net]

  # PROVISIONAL: minimal PostgreSQL until INFRA-01 (endy-rkt) delivers the shared instance.
  # Replace this service and infrastructure/docker/postgres/init/ when INFRA-01 lands.
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      LIDAR_DB_NAME: ${LIDAR_DB_NAME:-lidar}
      LIDAR_MIGRATION_DB_USER: ${LIDAR_MIGRATION_DB_USER:-lidar_migrator}
      LIDAR_MIGRATION_DB_PASSWORD: ${LIDAR_MIGRATION_DB_PASSWORD:?Set LIDAR_MIGRATION_DB_PASSWORD}
      LIDAR_RUNTIME_DB_USER: ${LIDAR_RUNTIME_DB_USER:-lidar_runtime}
      LIDAR_RUNTIME_DB_PASSWORD: ${LIDAR_RUNTIME_DB_PASSWORD:?Set LIDAR_RUNTIME_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infrastructure/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP check: the init-time server listens on the Unix socket only.
      test:
        [
          'CMD-SHELL',
          'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d postgres',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  lidar:
    build:
      context: .
      dockerfile: apps/backend/lidar/Dockerfile
    environment:
      PORT: '3000'
      DATABASE_URL: postgresql://${LIDAR_RUNTIME_DB_USER:-lidar_runtime}:${LIDAR_RUNTIME_DB_PASSWORD:?Set LIDAR_RUNTIME_DB_PASSWORD}@postgres:5432/${LIDAR_DB_NAME:-lidar}
      MIGRATION_DATABASE_URL: postgresql://${LIDAR_MIGRATION_DB_USER:-lidar_migrator}:${LIDAR_MIGRATION_DB_PASSWORD:?Set LIDAR_MIGRATION_DB_PASSWORD}@postgres:5432/${LIDAR_DB_NAME:-lidar}
      CONTENT_SERVICE_URL: ${LIDAR_CONTENT_SERVICE_URL:-http://content:3000}
      PUBLIC_ASSET_BASE_PATH: ${LIDAR_PUBLIC_ASSET_BASE_PATH:-/api/lidar/files}
      LIDAR_ADMIN_TOKEN: ${LIDAR_ADMIN_TOKEN:?Set LIDAR_ADMIN_TOKEN}
    expose:
      - '3000'
    ports:
      - '127.0.0.1:${LIDAR_HOST_PORT:-3004}:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

networks:
  internal_net:
    internal: true
  # Outbound access to the blockchain RPC and Pinata.
  egress_net: {}

volumes:
  media:
  postgres-data:
