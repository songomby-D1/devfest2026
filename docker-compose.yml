# Local stack (INFRA-01). Agent 1 owns this file; other owners propose a fragment such as
# apps/backend/content/compose.fragment.yml, merged here at integration time.
# First run: npm run setup:env && docker compose up --build
name: lova

x-required:
  &required-env # Interpolation fails early with a hint when the root .env is missing.
  POSTGRES_USER: ${POSTGRES_USER:?Run npm run setup:env to create the root .env}

services:
  # Shared PostgreSQL (D04): one database and two scoped roles per stateful service.
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      <<: *required-env
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      AUTH_DB_NAME: ${AUTH_DB_NAME:-auth}
      AUTH_MIGRATION_DB_USER: ${AUTH_MIGRATION_DB_USER:-auth_migrator}
      AUTH_MIGRATION_DB_PASSWORD: ${AUTH_MIGRATION_DB_PASSWORD:?Set AUTH_MIGRATION_DB_PASSWORD}
      AUTH_RUNTIME_DB_USER: ${AUTH_RUNTIME_DB_USER:-auth_runtime}
      AUTH_RUNTIME_DB_PASSWORD: ${AUTH_RUNTIME_DB_PASSWORD:?Set AUTH_RUNTIME_DB_PASSWORD}
      CONTENT_DB_NAME: ${CONTENT_DB_NAME:-}
      CONTENT_MIGRATION_DB_USER: ${CONTENT_MIGRATION_DB_USER:-content_migrator}
      CONTENT_MIGRATION_DB_PASSWORD: ${CONTENT_MIGRATION_DB_PASSWORD:-}
      CONTENT_RUNTIME_DB_USER: ${CONTENT_RUNTIME_DB_USER:-content_runtime}
      CONTENT_RUNTIME_DB_PASSWORD: ${CONTENT_RUNTIME_DB_PASSWORD:-}
      NFT_DB_NAME: ${NFT_DB_NAME:-}
      NFT_MIGRATION_DB_USER: ${NFT_MIGRATION_DB_USER:-nft_migrator}
      NFT_MIGRATION_DB_PASSWORD: ${NFT_MIGRATION_DB_PASSWORD:-}
      NFT_RUNTIME_DB_USER: ${NFT_RUNTIME_DB_USER:-nft_runtime}
      NFT_RUNTIME_DB_PASSWORD: ${NFT_RUNTIME_DB_PASSWORD:-}
      LIDAR_DB_NAME: ${LIDAR_DB_NAME:-}
      LIDAR_MIGRATION_DB_USER: ${LIDAR_MIGRATION_DB_USER:-lidar_migrator}
      LIDAR_MIGRATION_DB_PASSWORD: ${LIDAR_MIGRATION_DB_PASSWORD:-}
      LIDAR_RUNTIME_DB_USER: ${LIDAR_RUNTIME_DB_USER:-lidar_runtime}
      LIDAR_RUNTIME_DB_PASSWORD: ${LIDAR_RUNTIME_DB_PASSWORD:-}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infrastructure/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP check: the init-time server listens on the Unix socket only.
      test:
        [
          'CMD-SHELL',
          'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d postgres',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal_net]

  # Private S3-compatible object storage (D05) with one identity per writing service.
  seaweedfs:
    image: chrislusf/seaweedfs:4.54
    restart: unless-stopped
    entrypoint: ['/bin/sh', '/etc/lova/start.sh']
    environment:
      S3_MEDIA_BUCKET: ${S3_MEDIA_BUCKET:-lova-media}
      S3_MODELS_BUCKET: ${S3_MODELS_BUCKET:-lova-models}
      SEAWEEDFS_ADMIN_ACCESS_KEY: ${SEAWEEDFS_ADMIN_ACCESS_KEY:?Set SEAWEEDFS_ADMIN_ACCESS_KEY}
      SEAWEEDFS_ADMIN_SECRET_KEY: ${SEAWEEDFS_ADMIN_SECRET_KEY:?Set SEAWEEDFS_ADMIN_SECRET_KEY}
      SEAWEEDFS_CONTENT_ACCESS_KEY: ${SEAWEEDFS_CONTENT_ACCESS_KEY:?Set SEAWEEDFS_CONTENT_ACCESS_KEY}
      SEAWEEDFS_CONTENT_SECRET_KEY: ${SEAWEEDFS_CONTENT_SECRET_KEY:?Set SEAWEEDFS_CONTENT_SECRET_KEY}
      SEAWEEDFS_LIDAR_ACCESS_KEY: ${SEAWEEDFS_LIDAR_ACCESS_KEY:?Set SEAWEEDFS_LIDAR_ACCESS_KEY}
      SEAWEEDFS_LIDAR_SECRET_KEY: ${SEAWEEDFS_LIDAR_SECRET_KEY:?Set SEAWEEDFS_LIDAR_SECRET_KEY}
    volumes:
      - seaweedfs-data:/data
      - ./infrastructure/docker/seaweedfs:/etc/lova:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -q -O /dev/null http://127.0.0.1:9333/cluster/status || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [internal_net]

  # One-shot job: creates the private buckets, then exits.
  seaweedfs-buckets:
    image: chrislusf/seaweedfs:4.54
    restart: 'no'
    entrypoint: ['/bin/sh', '/etc/lova/create-buckets.sh']
    environment:
      S3_MEDIA_BUCKET: ${S3_MEDIA_BUCKET:-lova-media}
      S3_MODELS_BUCKET: ${S3_MODELS_BUCKET:-lova-models}
      SEAWEEDFS_MASTER: seaweedfs:9333
    volumes:
      - ./infrastructure/docker/seaweedfs:/etc/lova:ro
    depends_on:
      seaweedfs:
        condition: service_healthy
    networks: [internal_net]

  # Auth (Agent 1): accounts, revocable opaque sessions and permissions (D07, D13).
  auth:
    build:
      context: .
      dockerfile: apps/backend/auth/Dockerfile
    restart: unless-stopped
    environment:
      PORT: '3000'
      DATABASE_URL: postgresql://${AUTH_RUNTIME_DB_USER:-auth_runtime}:${AUTH_RUNTIME_DB_PASSWORD:?Set AUTH_RUNTIME_DB_PASSWORD}@postgres:5432/${AUTH_DB_NAME:-auth}
      MIGRATION_DATABASE_URL: postgresql://${AUTH_MIGRATION_DB_USER:-auth_migrator}:${AUTH_MIGRATION_DB_PASSWORD:?Set AUTH_MIGRATION_DB_PASSWORD}@postgres:5432/${AUTH_DB_NAME:-auth}
      AUTH_INBOUND_TOKEN_GATEWAY: ${SERVICE_TOKEN_GATEWAY_TO_AUTH:?Set SERVICE_TOKEN_GATEWAY_TO_AUTH}
    expose: ['3000']
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal_net]

  # Gateway (Agent 1): the frontend's only entry point (D06). Only published service.
  gateway:
    build:
      context: .
      dockerfile: apps/backend/gateway/Dockerfile
    restart: unless-stopped
    environment:
      PORT: '3000'
      AUTH_SERVICE_URL: http://auth:3000
      CONTENT_SERVICE_URL: ${GATEWAY_CONTENT_SERVICE_URL:-http://content:3000}
      NFT_SERVICE_URL: ${GATEWAY_NFT_SERVICE_URL:-http://nft-service:3005}
      LIDAR_SERVICE_URL: ${GATEWAY_LIDAR_SERVICE_URL:-http://lidar:3000}
      AUTH_SERVICE_TOKEN: ${SERVICE_TOKEN_GATEWAY_TO_AUTH:?Set SERVICE_TOKEN_GATEWAY_TO_AUTH}
      CONTENT_SERVICE_TOKEN: ${SERVICE_TOKEN_GATEWAY_TO_CONTENT:?Set SERVICE_TOKEN_GATEWAY_TO_CONTENT}
      NFT_SERVICE_TOKEN: ${SERVICE_TOKEN_GATEWAY_TO_NFT:?Set SERVICE_TOKEN_GATEWAY_TO_NFT}
      LIDAR_SERVICE_TOKEN: ${SERVICE_TOKEN_GATEWAY_TO_LIDAR:?Set SERVICE_TOKEN_GATEWAY_TO_LIDAR}
      GATEWAY_ADMIN_TOKEN: ${GATEWAY_ADMIN_TOKEN:?Set GATEWAY_ADMIN_TOKEN}
      GATEWAY_ALLOWED_ORIGINS: ${GATEWAY_ALLOWED_ORIGINS:-http://localhost:5173}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-10}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-104857600}
    ports:
      - '${GATEWAY_BIND_ADDRESS:-127.0.0.1}:${GATEWAY_HOST_PORT:-3000}:3000'
    depends_on:
      auth:
        condition: service_healthy
    networks: [internal_net, edge_net]

  # Content & Verification (owner: Agent 2), from apps/backend/content/compose.fragment.yml.
  # Not published: the gateway forwards /api/items... to /internal/v1/items...
  content:
    build:
      context: .
      dockerfile: apps/backend/content/Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      PORT: '3000'
      DATABASE_URL: postgresql://${CONTENT_RUNTIME_DB_USER:-content_runtime}:${CONTENT_RUNTIME_DB_PASSWORD:?Set CONTENT_RUNTIME_DB_PASSWORD}@postgres:5432/${CONTENT_DB_NAME:?Set CONTENT_DB_NAME}
      MIGRATION_DATABASE_URL: postgresql://${CONTENT_MIGRATION_DB_USER:-content_migrator}:${CONTENT_MIGRATION_DB_PASSWORD:?Set CONTENT_MIGRATION_DB_PASSWORD}@postgres:5432/${CONTENT_DB_NAME:?Set CONTENT_DB_NAME}
      CONTENT_INBOUND_TOKEN_GATEWAY: ${SERVICE_TOKEN_GATEWAY_TO_CONTENT:?Set SERVICE_TOKEN_GATEWAY_TO_CONTENT}
      CONTENT_INBOUND_TOKEN_NFT: ${SERVICE_TOKEN_NFT_TO_CONTENT:-}
      CONTENT_INBOUND_TOKEN_LIDAR: ${SERVICE_TOKEN_LIDAR_TO_CONTENT:-}
      # Private media storage (D05), from apps/backend/content/compose.fragment.yml.
      STORAGE_ENDPOINT: http://seaweedfs:8333
      STORAGE_REGION: us-east-1
      STORAGE_BUCKET: ${S3_MEDIA_BUCKET:-lova-media}
      STORAGE_PREFIX: ${CONTENT_STORAGE_PREFIX:-content/}
      STORAGE_FORCE_PATH_STYLE: 'true'
      STORAGE_ACCESS_KEY_ID: ${SEAWEEDFS_CONTENT_ACCESS_KEY:?Set SEAWEEDFS_CONTENT_ACCESS_KEY}
      STORAGE_SECRET_ACCESS_KEY: ${SEAWEEDFS_CONTENT_SECRET_KEY:?Set SEAWEEDFS_CONTENT_SECRET_KEY}
      # Keep the video limit below the gateway's MAX_UPLOAD_BYTES, which
      # counts the whole multipart body.
      MEDIA_MAX_IMAGE_BYTES: ${CONTENT_MEDIA_MAX_IMAGE_BYTES:-12582912}
      MEDIA_MAX_VIDEO_BYTES: ${CONTENT_MEDIA_MAX_VIDEO_BYTES:-52428800}
      MEDIA_MAX_PER_ITEM: ${CONTENT_MEDIA_MAX_PER_ITEM:-10}
    expose: ['3000']
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs-buckets:
        condition: service_completed_successfully
    networks: [internal_net]

  # NFT service (owner: salandri-42, Agent 2). See apps/backend/nft/nft_context.md.
  # No published port: the gateway relays its read-only routes (§10.4).
  # The chain, minter key and IPFS settings stay in apps/backend/nft/.env; the
  # cross-service settings below come from apps/backend/nft/compose.fragment.yml.
  nft-service:
    build:
      context: .
      dockerfile: apps/backend/nft/Dockerfile
      target: development
    restart: unless-stopped
    env_file:
      - path: apps/backend/nft/.env
        required: true
    environment:
      MEDIA_ROOT: /data/media
      CONTENT_SERVICE_URL: ${NFT_CONTENT_SERVICE_URL:-http://content:3000}
      CONTENT_SERVICE_TOKEN: ${SERVICE_TOKEN_NFT_TO_CONTENT:-}
      CONTENT_TIMEOUT_MS: ${NFT_CONTENT_TIMEOUT_MS:-3000}
      DATABASE_URL: postgresql://${NFT_RUNTIME_DB_USER:-nft_runtime}:${NFT_RUNTIME_DB_PASSWORD:?Set NFT_RUNTIME_DB_PASSWORD}@postgres:5432/${NFT_DB_NAME:?Set NFT_DB_NAME}
      MIGRATION_DATABASE_URL: postgresql://${NFT_MIGRATION_DB_USER:-nft_migrator}:${NFT_MIGRATION_DB_PASSWORD:?Set NFT_MIGRATION_DB_PASSWORD}@postgres:5432/${NFT_DB_NAME:?Set NFT_DB_NAME}
      NFT_INBOUND_TOKEN_GATEWAY: ${SERVICE_TOKEN_GATEWAY_TO_NFT:?Set SERVICE_TOKEN_GATEWAY_TO_NFT}
    volumes:
      # Shared media, read-only for NFT. Pending decision E5 (volume or S3).
      - media:/data/media:ro
    depends_on:
      content:
        condition: service_started
      postgres:
        condition: service_healthy
    networks: [internal_net, egress_net]

  # LiDAR (owner: Agent 3): 3D asset records and variant delivery (3D-07, 3D-04b, 3D-04c).
  # Not published: the gateway relays GET /assets/by-content/{contentId} and GET /files/{path}.
  lidar:
    build:
      context: .
      dockerfile: apps/backend/lidar/Dockerfile
    restart: unless-stopped
    environment:
      PORT: '3000'
      DATABASE_URL: postgresql://${LIDAR_RUNTIME_DB_USER:-lidar_runtime}:${LIDAR_RUNTIME_DB_PASSWORD:?Set LIDAR_RUNTIME_DB_PASSWORD}@postgres:5432/${LIDAR_DB_NAME:?Set LIDAR_DB_NAME}
      MIGRATION_DATABASE_URL: postgresql://${LIDAR_MIGRATION_DB_USER:-lidar_migrator}:${LIDAR_MIGRATION_DB_PASSWORD:?Set LIDAR_MIGRATION_DB_PASSWORD}@postgres:5432/${LIDAR_DB_NAME:?Set LIDAR_DB_NAME}
      CONTENT_SERVICE_URL: ${LIDAR_CONTENT_SERVICE_URL:-http://content:3000}
      PUBLIC_ASSET_BASE_PATH: ${LIDAR_PUBLIC_ASSET_BASE_PATH:-/api/lidar/files}
      LIDAR_ADMIN_TOKEN: ${LIDAR_ADMIN_TOKEN:?Set LIDAR_ADMIN_TOKEN}
      # SeaweedFS identity scoped to the models bucket (apps/backend/lidar/compose.fragment.yml).
      STORAGE_ENDPOINT: http://seaweedfs:8333
      STORAGE_REGION: us-east-1
      STORAGE_BUCKET: ${S3_MODELS_BUCKET:-lova-models}
      STORAGE_PREFIX: ${LIDAR_STORAGE_PREFIX:-}
      STORAGE_FORCE_PATH_STYLE: 'true'
      STORAGE_ACCESS_KEY_ID: ${SEAWEEDFS_LIDAR_ACCESS_KEY:?Set SEAWEEDFS_LIDAR_ACCESS_KEY}
      STORAGE_SECRET_ACCESS_KEY: ${SEAWEEDFS_LIDAR_SECRET_KEY:?Set SEAWEEDFS_LIDAR_SECRET_KEY}
      # Image-to-3D generation: optional, disabled unless both values are set.
      MESHY_API_KEY: ${MESHY_API_KEY:-}
      LIDAR_INBOUND_TOKEN_GATEWAY: ${SERVICE_TOKEN_GATEWAY_TO_LIDAR:-}
    expose: ['3000']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs-buckets:
        condition: service_completed_successfully
    networks: [internal_net]

networks:
  # Service listeners stay unreachable from outside Compose.
  internal_net:
    internal: true
  # Outbound access to the blockchain RPC and Pinata.
  egress_net: {}
  # Published gateway port only.
  edge_net: {}

volumes:
  postgres-data:
  seaweedfs-data:
  media:
