# Local demo override: docker compose -f docker-compose.yml -f docker-compose.demo.yml up
#
# - Adds a local EVM chain (Ganache, chain id 31337) for the PreservingArt contract.
# - Runs the NFT service from its runtime image so migrations apply on start.
# Chain settings, the minter key, CONTRACT_ADDRESS and IPFS_DRIVER=fake come from
# apps/backend/nft/.env, written by scripts/demo/setup.mjs. Local demo only: never
# use these values elsewhere.
services:
  chain:
    # Ganache's published image is amd64-only and fails with "exec format error" on arm64
    # hosts such as Apple Silicon. The Node image runs the same pinned Ganache release on
    # every architecture the demo host may use.
    image: node:20-bookworm-slim
    restart: unless-stopped
    command:
      - npx
      - -y
      - ganache@7.9.2
      - --chain.chainId=31337
      - --chain.hardfork=shanghai
      # The gallery wallet: a random key generated by scripts/demo/setup.mjs into .env,
      # funded with 1000 test ETH on this local chain only.
      - --wallet.accounts=${DEMO_MINTER_PRIVATE_KEY:?Run node scripts/demo/setup.mjs},0x3635C9ADC5DEA00000
      - --miner.blockTime=1
      - --server.host=0.0.0.0
      - --logging.quiet=true
    ports:
      - '127.0.0.1:8545:8545'
    networks: [internal_net, edge_net]

  nft-service:
    build:
      target: runtime
    depends_on:
      chain:
        condition: service_started
