<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LOVA | L’héritage malagasy prend vie</title>
    <meta
      name="description"
      content="LOVA, le musée numérique et participatif du patrimoine malagasy : peintures, sculptures et savoir-faire, relus par des humains et certifiés sur la blockchain."
    />
    <meta name="theme-color" content="#b8daf1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="preload"
      href="/fonts/ofl/TikTokSans-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/ofl/DepartureMono-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      /* Boot screen: shown from the first bytes, replaced when the app mounts. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #cce6f6;
      }
      .boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: linear-gradient(0deg, #cce6f6 0%, #b8daf1 100%);
        font:
          700 15px/1 system-ui,
          sans-serif;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #000;
      }
      .boot span {
        display: block;
        width: 120px;
        height: 3px;
        margin-top: 14px;
        overflow: hidden;
        background: rgb(0 0 0 / 0.12);
      }
      .boot span::after {
        display: block;
        width: 40%;
        height: 100%;
        content: '';
        background: #c0fe04;
        animation: boot 1.1s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      @keyframes boot {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot span::after {
          width: 100%;
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="Chargement de LOVA">
        <div>Lova<span></span></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
