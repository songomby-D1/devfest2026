# Serves the single-page app and relays /api to the gateway, so the browser keeps one
# origin (D06). TLS is terminated in front of this container (infrastructure/deploy).

# Hashed Vite assets are immutable; index.html is revalidated; API responses keep the
# gateway's own caching headers (an empty value adds no header).
map $uri $lova_cache_control {
  ~^/assets/ "public, max-age=31536000, immutable";
  ~^/api/    "";
  default    "no-cache";
}

server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;

  # The gateway enforces MAX_UPLOAD_BYTES (100 MiB by default); stay just above it.
  client_max_body_size 110m;

  add_header Cache-Control $lova_cache_control always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  # Docker's embedded DNS, so a recreated gateway container is found again.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location /api/ {
    set $gateway http://gateway:3000;
    proxy_pass $gateway;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    # Stream uploads straight to the gateway instead of buffering them on disk.
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  # A missing static file is a real 404, never the app shell: the licensed fonts and
  # cultural media are absent from the image on purpose (D18), and the app falls back.
  location ~ ^/(assets|fonts|media|draco|demo)/ {
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
