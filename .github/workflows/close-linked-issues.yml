name: Close linked issues

# GitHub only honours closing keywords ("Closes #12") when a PR merges into the
# default branch (main). Work merges into develop first, so this workflow closes
# the issues a merged develop PR names with a closing keyword.

on:
  pull_request:
    types: [closed]
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: close-linked-issues-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  close:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      issues: write
    steps:
      - name: Close issues named with a closing keyword
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Untrusted text: only read through env, never interpolated into the script.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          # Same keywords as GitHub: close(s|d), fix(es|ed), resolve(s|d), optional colon,
          # same-repository references only (#123).
          numbers="$(printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" \
            | grep -oiE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?):?[[:space:]]+#[0-9]+\b' \
            | grep -oE '[0-9]+$' | sort -un || true)"

          if [[ -z "$numbers" ]]; then
            echo "No closing keywords found in PR #$PR_NUMBER."
            exit 0
          fi

          for n in $numbers; do
            # Skip pull requests and anything that is not an open issue.
            info="$(gh api "repos/$GH_REPO/issues/$n" --jq '[.state, (.pull_request != null)] | @tsv' 2>/dev/null || true)"
            if [[ "$info" != $'open\tfalse' ]]; then
              echo "Skipping #$n (${info:-not found})."
              continue
            fi
            gh issue close "$n" --reason completed \
              --comment "Closed by #$PR_NUMBER, merged into \`develop\`."
            echo "Closed #$n."
          done
