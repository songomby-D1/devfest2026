openapi: 3.1.0
info:
  title: LiDAR service API
  version: 0.1.0
  description: >-
    Internal API of the LiDAR service, reached through the gateway. Owned by shidoAdr (D14).
    Object keys and credentials never appear in responses. The content ID format and the Content
    publication check are provisional until the Content contract (CONTENT-02) is agreed.
servers:
  - url: http://lidar:3000
    description: Service address inside Compose
paths:
  /health:
    get:
      operationId: getHealth
      summary: Report liveness and database connectivity
      responses:
        '200':
          description: The service and its database answer
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { const: ok }
        '503':
          description: The database is unreachable
          content:
            application/json:
              schema:
                type: object
                required: [status, reason]
                properties:
                  status: { const: error }
                  reason: { const: database_unavailable }
  /assets:
    post:
      operationId: registerAsset
      summary: Register an asset prepared offline for a published content item
      description: >-
        Interim protection by a service token until gateway authentication (D07). The content ID is
        confirmed with Content before the record is stored.
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterAssetRequest' }
      responses:
        '201':
          description: Asset registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisteredAsset' }
        '400':
          description: Invalid body
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
        '401':
          description: Missing or wrong service token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: An asset is already registered for this content
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Content is unknown or not published
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Content could not confirm publication
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /assets/by-content/{contentId}:
    get:
      operationId: getAssetByContent
      summary: Display metadata of the 3D asset of a content item
      parameters:
        - name: contentId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/ContentId' }
      responses:
        '200':
          description: A ready asset, or the defined "none" response
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ReadyAssetDisplay'
                  - $ref: '#/components/schemas/NoAssetDisplay'
        '400':
          description: Malformed content ID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
  /assets/{assetId}/files/{variant}:
    put:
      operationId: uploadAssetFile
      summary: Store one prepared file of an asset (3D-04c)
      description: >-
        Streams one 3D-04a output to object storage at the key registered for the asset. The body is
        the raw file. GLB and poster sizes must equal the registered sizes; the USDZ is capped at
        64 MiB. The file signature must match the variant. A pending asset becomes ready once its
        GLB 1K, GLB 2K and poster are stored. Files of a ready asset are never overwritten, so their
        delivery URLs stay immutable. Interim protection by the service token until D07. Errors
        use the PublicError shape.
      security:
        - adminToken: []
      parameters:
        - $ref: '#/components/parameters/AssetId'
        - $ref: '#/components/parameters/FileVariant'
        - name: Content-Length
          in: header
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          model/gltf-binary:
            schema: { type: string, contentMediaType: model/gltf-binary }
          image/webp:
            schema: { type: string, contentMediaType: image/webp }
          model/vnd.usdz+zip:
            schema: { type: string, contentMediaType: model/vnd.usdz+zip }
          application/octet-stream:
            schema: { type: string, contentMediaType: application/octet-stream }
      responses:
        '201':
          description: File stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoredFile' }
        '401': { $ref: '#/components/responses/PublicError' }
        '404': { $ref: '#/components/responses/PublicError' }
        '409':
          description: USDZ_NOT_REGISTERED, or FILE_ALREADY_STORED for a ready asset
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicError' }
        '411': { $ref: '#/components/responses/PublicError' }
        '413': { $ref: '#/components/responses/PublicError' }
        '415': { $ref: '#/components/responses/PublicError' }
        '422':
          description: SIZE_MISMATCH or INVALID_FILE (signature or body length)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicError' }
        '503': { $ref: '#/components/responses/PublicError' }
  /files/{assetId}/{variant}:
    get:
      operationId: getAssetFile
      summary: Stream a stored file of a ready asset of a published item (3D-04c)
      description: >-
        Gateway-mediated delivery (D05). The gateway exposes this route under PUBLIC_ASSET_BASE_PATH,
        for example GET /api/lidar/files/{assetId}/1k, and forwards GET and HEAD requests, the Range header
        and the x-request-id header unchanged. Publication is re-checked with Content on
        every request. One byte range per request is honored; other Range headers return the whole
        file. Unknown assets, assets that are not ready, unpublished items and missing objects all
        return 404 MODEL3D_FILE_NOT_FOUND so the frontend shows its poster or still-image fallback.
        HEAD is supported with the same headers and no body.
      parameters:
        - $ref: '#/components/parameters/AssetId'
        - $ref: '#/components/parameters/FileVariant'
        - name: Range
          in: header
          required: false
          schema: { type: string, examples: ['bytes=0-1023'] }
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The whole file
          headers:
            Cache-Control:
              { $ref: '#/components/headers/ImmutableCacheControl' }
            Accept-Ranges: { schema: { const: bytes } }
            Content-Length: { schema: { type: integer } }
            ETag: { schema: { type: string } }
          content:
            model/gltf-binary:
              schema: { type: string, contentMediaType: model/gltf-binary }
            image/webp:
              schema: { type: string, contentMediaType: image/webp }
            model/vnd.usdz+zip:
              schema: { type: string, contentMediaType: model/vnd.usdz+zip }
        '206':
          description: The requested byte range
          headers:
            Cache-Control:
              { $ref: '#/components/headers/ImmutableCacheControl' }
            Content-Range:
              { schema: { type: string, examples: ['bytes 0-1023/73760'] } }
            Content-Length: { schema: { type: integer } }
          content:
            model/gltf-binary:
              schema: { type: string, contentMediaType: model/gltf-binary }
            image/webp:
              schema: { type: string, contentMediaType: image/webp }
            model/vnd.usdz+zip:
              schema: { type: string, contentMediaType: model/vnd.usdz+zip }
        '404':
          description: MODEL3D_FILE_NOT_FOUND. Not cached (Cache-Control no-store).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicError' }
        '416':
          description: RANGE_NOT_SATISFIABLE, with Content-Range bytes */{size}
          headers:
            Content-Range:
              { schema: { type: string, examples: ['bytes */73760'] } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicError' }
        '503':
          description: CONTENT_UNAVAILABLE or STORAGE_UNAVAILABLE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicError' }
components:
  parameters:
    AssetId:
      name: assetId
      in: path
      required: true
      schema: { type: string, format: uuid }
    FileVariant:
      name: variant
      in: path
      required: true
      description: >-
        1k and 2k are GLB (model/gltf-binary), poster is WebP (image/webp), usdz is
        model/vnd.usdz+zip and exists only when a USDZ key was registered.
      schema:
        type: string
        enum: ['1k', '2k', poster, usdz]
    RequestId:
      name: x-request-id
      in: header
      required: false
      description: Propagated by the gateway and echoed in errors; generated when absent or unsafe.
      schema: { type: string, pattern: '^[A-Za-z0-9._:-]{1,128}$' }
  headers:
    ImmutableCacheControl:
      schema: { const: 'public, max-age=31536000, immutable' }
  responses:
    PublicError:
      description: Error in the public shape
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PublicError' }
  securitySchemes:
    adminToken:
      type: apiKey
      in: header
      name: x-lidar-admin-token
  schemas:
    ContentId:
      type: string
      format: uuid
    ObjectKey:
      type: string
      minLength: 1
      maxLength: 512
      pattern: '^[A-Za-z0-9][A-Za-z0-9._/-]*$'
      description: Relative storage key. Must not contain "..".
    ByteSize:
      type: integer
      minimum: 1
      maximum: 2147483647
    AssetStatus:
      type: string
      enum: [pending, ready]
    RegisterAssetRequest:
      type: object
      additionalProperties: false
      required:
        [
          contentId,
          objectKey1k,
          objectKey2k,
          posterKey,
          size1kBytes,
          size2kBytes,
          posterBytes,
        ]
      properties:
        contentId: { $ref: '#/components/schemas/ContentId' }
        objectKey1k: { $ref: '#/components/schemas/ObjectKey' }
        objectKey2k: { $ref: '#/components/schemas/ObjectKey' }
        posterKey: { $ref: '#/components/schemas/ObjectKey' }
        usdzKey:
          oneOf:
            - $ref: '#/components/schemas/ObjectKey'
            - type: 'null'
          default: null
        size1kBytes: { $ref: '#/components/schemas/ByteSize' }
        size2kBytes: { $ref: '#/components/schemas/ByteSize' }
        posterBytes: { $ref: '#/components/schemas/ByteSize' }
        status:
          $ref: '#/components/schemas/AssetStatus'
          default: ready
    RegisteredAsset:
      type: object
      required: [id, contentId, status]
      properties:
        id: { type: string, format: uuid }
        contentId: { $ref: '#/components/schemas/ContentId' }
        status: { $ref: '#/components/schemas/AssetStatus' }
    DeliveryVariant:
      type: object
      required: [url, bytes]
      properties:
        url:
          type: string
          description: >-
            Gateway delivery path, for example /api/lidar/files/{assetId}/1k, served by
            GET /files/{assetId}/{variant} behind the gateway
        bytes: { $ref: '#/components/schemas/ByteSize' }
    ReadyAssetDisplay:
      type: object
      required: [contentId, status, variants, poster, ar]
      properties:
        contentId: { $ref: '#/components/schemas/ContentId' }
        status: { const: ready }
        variants:
          type: object
          required: ['1k', '2k']
          properties:
            '1k': { $ref: '#/components/schemas/DeliveryVariant' }
            '2k': { $ref: '#/components/schemas/DeliveryVariant' }
        poster:
          type: object
          required: [url]
          properties:
            url: { type: string }
        ar:
          type: 'null'
          description: Always null while the USDZ is withheld (ADR 0001).
    NoAssetDisplay:
      type: object
      required: [contentId, status]
      properties:
        contentId: { $ref: '#/components/schemas/ContentId' }
        status: { const: none }
    StoredFile:
      type: object
      required: [assetId, variant, bytes, assetStatus]
      properties:
        assetId: { type: string, format: uuid }
        variant: { type: string, enum: ['1k', '2k', poster, usdz] }
        bytes: { type: integer, minimum: 1 }
        assetStatus: { $ref: '#/components/schemas/AssetStatus' }
    PublicError:
      type: object
      description: Public error shape of the frozen contract, used by the 3D-04c file routes.
      required: [code, message, requestId]
      additionalProperties: false
      properties:
        code:
          type: string
          examples:
            [MODEL3D_FILE_NOT_FOUND, RANGE_NOT_SATISFIABLE, STORAGE_UNAVAILABLE]
        message: { type: string }
        requestId: { type: string }
    Error:
      type: object
      description: NestJS default error body until the gateway error contract is agreed.
      required: [statusCode, message]
      properties:
        statusCode: { type: integer }
        message: { type: string }
        error: { type: string }
    ValidationError:
      type: object
      required: [message, issues]
      properties:
        message: { const: Validation failed }
        issues:
          type: array
          items:
            type: object
            required: [path, message]
            properties:
              path: { type: string }
              message: { type: string }
