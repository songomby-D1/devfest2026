openapi: 3.1.0
info:
  title: LOVA Content & Verification internal API
  version: 0.4.0
  description: >-
    Internal API of the Content service (CONTENT-01 #52, CONTENT-02 #53,
    CONTENT-03 #54, CONTENT-04 #56). Only the gateway, and
    NFT and LiDAR for service calls, reach it on the internal network. The
    gateway forwards `/api/items...` to `/internal/v1/items...` with the same
    method, path rest, query and body (platform contract). Request and
    response bodies match the gateway's `CreateItemRequest` and `ItemDetail`.


    Every `/internal` request is authenticated by the (`x-service-name`,
    `x-service-token`) pair, with one secret per caller. Caller context comes
    from `x-caller-user-id` (or the older `x-caller-account-id`),
    `x-caller-permissions` and `x-request-id`.


    Publication (CONTENT-02): an item moves `draft` → `published` →
    `unpublished`, and an unpublished item can be published again. Only a
    reviewer changes the publication, and publishing needs both claims
    reviewed and the rights confirmed (D13, D18). Every change is recorded
    with the reviewer and note in the publication history.


    Media (CONTENT-03): the owner of an item that is not published uploads,
    replaces and removes JPEG, PNG or WebP images and MP4 or WebM videos.
    Files are checked against their declared type and file signature,
    stored in private S3-compatible storage under generated keys (D05), and
    streamed back with byte ranges. A media change resets the item claim to
    `unreviewed` (D18 re-review).


    Review (CONTENT-04): a reviewer records the outcome of the item claims
    and of the description claims separately (`verified` or `uncertain`),
    with a rationale and evidence, on someone else's submission `in_review`.
    The review route is the only way a claim becomes `verified` or
    `uncertain`; an owner edit resets the changed claims to `unreviewed`,
    and automated signals never change a claim. Every review is kept in the
    review history with the previous status. Publication stays a separate
    reviewer decision (`publish`): settlement S3, automatic publication after
    the last review, is only proposed.


    Submission workflow (CONTENT-04): `return` sends a submission in review
    back to its owner; `reject` closes it for good (no edit, media change,
    review or publication). A real owner edit or media change of a
    `returned` submission, or of an `accepted` one that was unpublished,
    puts it back `in_review`, so it is listed under `scope=review` again.


    `advisorySignals` is an empty array, for the owner and reviewers only,
    until CONTENT-05c.
servers:
  - url: http://content:3000
    description: Internal Compose network
security:
  - serviceName: []
    serviceToken: []
tags:
  - name: items
  - name: health
paths:
  /health:
    get:
      tags: [health]
      operationId: health
      summary: Liveness check
      security: []
      responses:
        '200':
          description: The service is running
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }
  /internal/v1/items:
    get:
      tags: [items]
      operationId: listItems
      summary: List items for browsing, own submissions or the review queue
      description: >-
        Gate 0 `GET /api/items`. `public` (default) lists `published` items
        for everyone, newest first. `mine` lists every item of the signed-in
        caller, newest first. `review` lists the submissions `in_review`,
        oldest first, without the reviewer's own submissions, and needs the
        `reviewer` permission. The order is on the immutable creation time
        and then the ID, so a cursor never skips or repeats an item. `q`
        matches a case-insensitive substring of the title or the author name;
        `%` and `_` are literal. Unknown query parameters are ignored.
      parameters:
        - $ref: '#/components/parameters/CallerUserId'
        - $ref: '#/components/parameters/CallerPermissions'
        - $ref: '#/components/parameters/RequestId'
        - name: scope
          in: query
          schema:
            { type: string, enum: [public, mine, review], default: public }
        - name: kind
          in: query
          schema: { $ref: '#/components/schemas/ItemKind' }
        - name: q
          in: query
          description: Trimmed. A blank value means no text filter.
          schema: { type: string, maxLength: 100 }
        - name: cursor
          in: query
          description: >-
            `nextCursor` of the previous page, passed back unchanged. A cursor
            from another scope answers `400`.
          schema: { type: string, maxLength: 200 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: One page of items
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemPage' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: '`FORBIDDEN`: `scope=review` without the `reviewer` permission.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicError' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [items]
      operationId: createItem
      summary: Submit an item with its author information and description
      description: >-
        Any signed-in caller can submit (D13). The author, item and
        description are created in one transaction, so invalid input stores
        nothing. The item starts as `draft`, `in_review`, with both claim
        statuses `unreviewed`. Its `id` is the ContentId used by NFT and LiDAR.
      parameters:
        - $ref: '#/components/parameters/CallerUserId'
        - $ref: '#/components/parameters/CallerPermissions'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateItemRequest' }
      responses:
        '201':
          description: The created item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemDetail' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '500': { $ref: '#/components/responses/InternalError' }
  /internal/v1/items/{id}:
    parameters:
      - $ref: '#/components/parameters/ItemId'
      - $ref: '#/components/parameters/CallerUserId'
      - $ref: '#/components/parameters/CallerPermissions'
      - $ref: '#/components/parameters/RequestId'
    get:
      tags: [items]
      operationId: getItem
      summary: Read one item
      description: >-
        A `published` item is visible to everyone, guests included. A `draft`
        or `unpublished` item is visible only to its owner and to callers with
        the `reviewer` permission; anyone else gets `404`, so its existence is
        not disclosed. Everyone who may read the item sees its claim statuses
        and `reviews`, the latest review of each claim that is still reviewed
        (guests only read published items, as settlement S5 proposes).
        `advisorySignals` is present only for the owner and reviewers.
      responses:
        '200':
          description: The item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemDetail' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [items]
      operationId: updateItem
      summary: Edit an own item that is not published
      description: >-
        Only the owner can edit, only while the item is `draft` or
        `unpublished` (D13) and never once the submission is `rejected`
        (`409 SUBMISSION_REJECTED`). A real change of a `returned` or
        `accepted` submission puts it back `in_review`. Fields left out are unchanged; optional text
        fields accept `null` to clear them. A change to the item metadata or
        author information resets the item claim status to `unreviewed`, and a
        change to the description text resets the description claim status
        (D18 re-review). Rights changes reset neither. Values identical to the
        current ones are not changes. Not routed by the gateway yet: see the
        contract need in the CONTENT-01 pull request.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateItemRequest' }
      responses:
        '200':
          description: The item after the edit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemDetail' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >-
            `ITEM_PUBLISHED`: a published item cannot be edited, or
            `SUBMISSION_REJECTED`: a rejected submission is closed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicError' }
        '500': { $ref: '#/components/responses/InternalError' }
  /internal/v1/items/{id}/media:
    parameters:
      - $ref: '#/components/parameters/ItemId'
      - $ref: '#/components/parameters/CallerUserId'
      - $ref: '#/components/parameters/CallerPermissions'
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [items]
      operationId: uploadMedia
      summary: Upload one image or video to an own item that is not published
      description: >-
        Gate 0 `POST /api/items/{id}/media`. Only the owner, and only while the
        item is `draft` or `unpublished` (D13). The `file` part must declare
        `image/jpeg`, `image/png`, `image/webp`, `video/mp4` or `video/webm`
        and its first bytes must match that type's signature; anything else
        is `415`. Size limits are set by `MEDIA_MAX_IMAGE_BYTES` (default
        12 MiB) and `MEDIA_MAX_VIDEO_BYTES` (default 50 MiB), and an item holds
        at most `MEDIA_MAX_PER_ITEM` files (default 10). The client filename
        is ignored. The new media is appended and the item claim resets to
        `unreviewed`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/MediaUpload' }
      responses:
        '201':
          description: The stored media, private until the item is published
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaRef' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/MediaConflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/StorageUnavailable' }
  /internal/v1/items/{id}/media/{mediaId}:
    parameters:
      - $ref: '#/components/parameters/ItemId'
      - $ref: '#/components/parameters/MediaId'
      - $ref: '#/components/parameters/CallerUserId'
      - $ref: '#/components/parameters/CallerPermissions'
      - $ref: '#/components/parameters/RequestId'
    get:
      tags: [items]
      operationId: getMedia
      summary: Stream a media file
      description: >-
        Gate 0 `GET /api/items/{id}/media/{mediaId}`. Visible under the same
        rule as the item: everyone for a `published` item, otherwise only the
        owner and reviewers; anyone else gets `404`. One byte range is
        honored (`206`); a range outside the file is `416`, and other range
        forms are served whole. The `ETag` is the quoted SHA-256 of the file
        and `If-None-Match` and `If-Range` use it. A published item's media
        is `public, max-age=3600, immutable`; otherwise `private, no-store`.
      parameters:
        - name: Range
          in: header
          required: false
          schema: { type: string, examples: ['bytes=0-1048575'] }
        - name: If-Range
          in: header
          required: false
          schema: { type: string }
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Whole file
          headers:
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string } }
            Accept-Ranges: { schema: { type: string, const: bytes } }
          content:
            image/*: { schema: { type: string, format: binary } }
            video/*: { schema: { type: string, format: binary } }
        '206':
          description: Requested range
          headers:
            Content-Range: { schema: { type: string } }
          content:
            image/*: { schema: { type: string, format: binary } }
            video/*: { schema: { type: string, format: binary } }
        '304':
          description: The `If-None-Match` validator matches.
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/MediaNotFound' }
        '416':
          description: '`RANGE_NOT_SATISFIABLE`, with `Content-Range: bytes */<size>`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicError' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/StorageUnavailable' }
    put:
      tags: [items]
      operationId: replaceMedia
      summary: Replace a media file of an own item that is not published
      description: >-
        Same body, rules and checks as `uploadMedia`. The new file takes the
        replaced one's position with a new media ID (URLs stay immutable),
        keeps its caption unless a new one is sent, and the old object is
        deleted. The item claim resets to `unreviewed`. Not routed by the
        gateway yet (contract need).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/MediaUpload' }
      responses:
        '200':
          description: The new media
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaRef' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/MediaNotFound' }
        '409': { $ref: '#/components/responses/MediaConflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/StorageUnavailable' }
    delete:
      tags: [items]
      operationId: deleteMedia
      summary: Remove a media file of an own item that is not published
      description: >-
        Removes the record and its object and resets the item claim to
        `unreviewed`. Not routed by the gateway yet (contract need).
      responses:
        '204':
          description: Removed
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/MediaNotFound' }
        '409': { $ref: '#/components/responses/MediaConflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /internal/v1/items/{id}/review:
    parameters:
      - $ref: '#/components/parameters/ItemId'
      - $ref: '#/components/parameters/CallerUserId'
      - $ref: '#/components/parameters/CallerPermissions'
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [items]
      operationId: reviewItem
      summary: Record a claim review
      description: >-
        Gate 0 `POST /api/items/{id}/review`. Reviewer only, and never on
        one's own submission. Sets the claim status of `target` (the item
        claims or the description claims) to `outcome` and records the
        review (reviewer, previous status, outcome, rationale, evidence,
        time) in the review history, in one transaction under the item row
        lock. Only a submission `in_review` can be reviewed. Recording an
        outcome never publishes the item.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewRequest' }
      responses:
        '201':
          description: The item after the review
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemDetail' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: >-
            `FORBIDDEN`: the caller lacks the `reviewer` permission, or tries
            to review their own submission.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: >-
            `SUBMISSION_NOT_IN_REVIEW`: the submission is `returned`,
            `rejected` or `accepted`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicError' }
        '500': { $ref: '#/components/responses/InternalError' }
  /internal/v1/items/{id}/decision:
    parameters:
      - $ref: '#/components/parameters/ItemId'
      - $ref: '#/components/parameters/CallerUserId'
      - $ref: '#/components/parameters/CallerPermissions'
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [items]
      operationId: decideItem
      summary: Publish, return or reject a submission
      description: >-
        Gate 0 `POST /api/items/{id}/decision`. Reviewer only, and never on
        one's own submission. Every decision is recorded with the reviewer
        and note in the publication history. `publish` moves a `draft` or `unpublished` item
        to `published`, sets the submission to `accepted` and `publishedAt` to
        now. It needs a submission `in_review` or `accepted`, both claims
        reviewed (`verified` or `uncertain`) and the rights confirmed, checked
        under a row lock so that a concurrent edit cannot slip in. Publishing a
        published item changes nothing and answers `200`. `return` moves a
        submission `in_review` to `returned`, and the owner's next real edit
        puts it back `in_review`. `reject` moves a submission `in_review` or
        `returned` to `rejected`, which is final. Both need a non-empty note,
        leave the publication status unchanged and are no-ops when repeated.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionRequest' }
      responses:
        '200':
          description: The item after the decision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemDetail' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/NotReviewer' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: >-
            A rule blocks the decision: `SUBMISSION_NOT_PUBLISHABLE` (the
            submission is `returned` or `rejected`), `CLAIMS_UNREVIEWED`,
            `RIGHTS_NOT_CONFIRMED`, or `SUBMISSION_NOT_IN_REVIEW` (`return`
            of a submission not in review, `reject` of an accepted one).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicError' }
        '500': { $ref: '#/components/responses/InternalError' }
  /internal/v1/items/{id}/unpublish:
    parameters:
      - $ref: '#/components/parameters/ItemId'
      - $ref: '#/components/parameters/CallerUserId'
      - $ref: '#/components/parameters/CallerPermissions'
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [items]
      operationId: unpublishItem
      summary: Take a published item out of public browsing
      description: >-
        Reviewer only. Moves a `published` item to `unpublished`: guests no
        longer list or read it, and the owner can edit it again. `publishedAt`
        keeps the last publication. Unpublishing an unpublished item changes
        nothing. Not routed by the gateway yet: see the contract need in the
        CONTENT-02 pull request.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UnpublishRequest' }
      responses:
        '200':
          description: The item after the change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemDetail' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/NotReviewer' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`ITEM_NOT_PUBLISHED`: a draft was never published.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicError' }
        '500': { $ref: '#/components/responses/InternalError' }
  /internal/v1/items/{id}/publication:
    parameters:
      - $ref: '#/components/parameters/ItemId'
      - $ref: '#/components/parameters/RequestId'
    get:
      tags: [items]
      operationId: getPublication
      summary: Publication status for NFT and LiDAR
      description: >-
        Platform contract service-to-service lookup (D01: the ContentId and the
        publication status are the handoffs from Content). Only the `nft` and
        `lidar` callers get an answer, for any existing item. The `gateway`
        caller gets `404`, so the route stays off the public surface and never
        reveals a draft. Callers decide eligibility themselves, for example
        NFT mints only when `publicationStatus` is `published`.
      responses:
        '200':
          description: The item's publication status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicationLookup' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404':
          description: '`NOT_FOUND`: the item does not exist, or the caller is the gateway.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicError' }
        '500': { $ref: '#/components/responses/InternalError' }
components:
  securitySchemes:
    serviceName:
      type: apiKey
      in: header
      name: x-service-name
      description: '`gateway`, `nft` or `lidar`.'
    serviceToken:
      type: apiKey
      in: header
      name: x-service-token
      description: >-
        Secret of the caller–Content pair (`CONTENT_INBOUND_TOKEN_<CALLER>`).
        A missing or wrong pair answers `401 SERVICE_UNAUTHENTICATED`.
  parameters:
    ItemId:
      name: id
      in: path
      required: true
      description: ContentId, an opaque UUID.
      schema: { type: string, format: uuid }
    MediaId:
      name: mediaId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CallerUserId:
      name: x-caller-user-id
      in: header
      required: false
      description: >-
        Auth account ID of the signed-in user, absent for a guest. The older
        `x-caller-account-id` name is also accepted. A value that is not a
        UUID answers `401 SERVICE_UNAUTHENTICATED`.
      schema: { type: string, format: uuid }
    CallerPermissions:
      name: x-caller-permissions
      in: header
      required: false
      description: Comma-separated permissions. Only `reviewer` is recognized.
      schema: { type: string, example: reviewer }
    RequestId:
      name: x-request-id
      in: header
      required: false
      description: Correlation ID echoed in error bodies. Generated when absent or unsafe.
      schema: { type: string, pattern: '^[A-Za-z0-9._:-]{1,128}$' }
  responses:
    ValidationFailed:
      description: '`VALIDATION_FAILED`, with one entry per invalid field.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PublicError' }
    Unauthenticated:
      description: >-
        `UNAUTHENTICATED` when a write has no caller user, or
        `SERVICE_UNAUTHENTICATED` when the service pair is missing or wrong.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PublicError' }
    Forbidden:
      description: '`FORBIDDEN`: the caller can see the item but is not its owner.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PublicError' }
    NotReviewer:
      description: >-
        `FORBIDDEN`: the caller lacks the `reviewer` permission, or tries to
        decide on their own submission.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PublicError' }
    NotFound:
      description: '`NOT_FOUND`: the item does not exist or is not visible to the caller.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PublicError' }
    MediaNotFound:
      description: >-
        `NOT_FOUND`: the item or the media does not exist or is not visible
        to the caller.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PublicError' }
    MediaConflict:
      description: >-
        `ITEM_PUBLISHED`: the media of a published item cannot be changed,
        `SUBMISSION_REJECTED`: a rejected submission is closed, or
        `MEDIA_LIMIT_REACHED`: the item already holds the maximum number of
        media files.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PublicError' }
    PayloadTooLarge:
      description: '`PAYLOAD_TOO_LARGE`: the file exceeds the limit for its kind.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PublicError' }
    UnsupportedMediaType:
      description: >-
        `UNSUPPORTED_MEDIA_TYPE`: the body is not multipart, the declared type
        is not accepted, or the file content does not match it.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PublicError' }
    StorageUnavailable:
      description: '`STORAGE_UNAVAILABLE`: object storage cannot be reached.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PublicError' }
    InternalError:
      description: '`INTERNAL_ERROR`, without internal details.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PublicError' }
  schemas:
    ContentId:
      type: string
      format: uuid
      description: Opaque identifier created by Content. Other services never parse it.
    ItemKind:
      type: string
      enum: [painting, sculpture, photograph, textile, object, other]
    PublicationStatus:
      type: string
      enum: [draft, published, unpublished]
    SubmissionStatus:
      type: string
      enum: [in_review, returned, rejected, accepted]
    ClaimStatus:
      type: string
      enum: [unreviewed, verified, uncertain]
    CreateItemRequest:
      type: object
      additionalProperties: false
      required: [title, kind, description, rightsStatement, rightsConfirmed]
      description: >-
        Text is trimmed. Optional text that is empty after trimming is stored
        as `null`.
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        kind: { $ref: '#/components/schemas/ItemKind' }
        description: { type: string, minLength: 1, maxLength: 8000 }
        creatorName: { type: [string, 'null'], maxLength: 160 }
        creatorCommunity: { type: [string, 'null'], maxLength: 160 }
        technique: { type: [string, 'null'], maxLength: 160 }
        origin: { type: [string, 'null'], maxLength: 160 }
        period: { type: [string, 'null'], maxLength: 80 }
        rightsStatement: { type: string, minLength: 1, maxLength: 2000 }
        rightsConfirmed: { type: boolean }
    UpdateItemRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        kind: { $ref: '#/components/schemas/ItemKind' }
        description: { type: string, minLength: 1, maxLength: 8000 }
        creatorName: { type: [string, 'null'], maxLength: 160 }
        creatorCommunity: { type: [string, 'null'], maxLength: 160 }
        technique: { type: [string, 'null'], maxLength: 160 }
        origin: { type: [string, 'null'], maxLength: 160 }
        period: { type: [string, 'null'], maxLength: 80 }
        rightsStatement: { type: string, minLength: 1, maxLength: 2000 }
        rightsConfirmed: { type: boolean }
    ClaimStatuses:
      type: object
      required: [item, description]
      properties:
        item: { $ref: '#/components/schemas/ClaimStatus' }
        description: { $ref: '#/components/schemas/ClaimStatus' }
    ItemDetail:
      type: object
      required:
        [
          id,
          title,
          kind,
          creatorName,
          origin,
          period,
          thumbnailUrl,
          publicationStatus,
          submissionStatus,
          claims,
          updatedAt,
          description,
          creator,
          rights,
          media,
          reviews,
          isOwner,
          createdAt,
          publishedAt,
        ]
      properties:
        id: { $ref: '#/components/schemas/ContentId' }
        title: { type: string }
        kind: { $ref: '#/components/schemas/ItemKind' }
        creatorName: { type: [string, 'null'] }
        origin: { type: [string, 'null'] }
        period: { type: [string, 'null'] }
        thumbnailUrl:
          type: [string, 'null']
          description: >-
            Gateway-relative URL of the first image in display order, or
            `null` when the item has no image.
        publicationStatus: { $ref: '#/components/schemas/PublicationStatus' }
        submissionStatus: { $ref: '#/components/schemas/SubmissionStatus' }
        claims: { $ref: '#/components/schemas/ClaimStatuses' }
        updatedAt: { type: string, format: date-time }
        description: { type: string }
        creator:
          type: object
          description: Free-text author information (S7), never an account.
          required: [name, community, technique]
          properties:
            name: { type: [string, 'null'] }
            community: { type: [string, 'null'] }
            technique: { type: [string, 'null'] }
        rights:
          type: object
          required: [statement, confirmed]
          properties:
            statement: { type: string }
            confirmed: { type: boolean }
        media:
          type: array
          description: In display order.
          items: { $ref: '#/components/schemas/MediaRef' }
        reviews:
          type: array
          description: >-
            The latest review of each target whose claim is still reviewed.
            A review whose claim was reset by an edit stays in the history
            only.
          maxItems: 2
          items: { $ref: '#/components/schemas/ClaimReview' }
        isOwner: { type: boolean }
        advisorySignals:
          type: array
          description: Present for the owner and reviewers only. Empty until CONTENT-05c.
          items: { type: object }
        createdAt: { type: string, format: date-time }
        publishedAt: { type: [string, 'null'], format: date-time }
    ItemSummary:
      type: object
      required:
        [
          id,
          title,
          kind,
          creatorName,
          origin,
          period,
          thumbnailUrl,
          publicationStatus,
          submissionStatus,
          claims,
          updatedAt,
        ]
      properties:
        id: { $ref: '#/components/schemas/ContentId' }
        title: { type: string }
        kind: { $ref: '#/components/schemas/ItemKind' }
        creatorName: { type: [string, 'null'] }
        origin: { type: [string, 'null'] }
        period: { type: [string, 'null'] }
        thumbnailUrl:
          type: [string, 'null']
          description: >-
            Gateway-relative URL of the first image in display order, or
            `null` when the item has no image.
        publicationStatus: { $ref: '#/components/schemas/PublicationStatus' }
        submissionStatus: { $ref: '#/components/schemas/SubmissionStatus' }
        claims: { $ref: '#/components/schemas/ClaimStatuses' }
        updatedAt: { type: string, format: date-time }
    ItemPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/ItemSummary' }
        nextCursor:
          type: [string, 'null']
          description: Opaque. `null` on the last page.
    ClaimTarget:
      type: string
      enum: [item, description]
    ReviewOutcome:
      type: string
      enum: [verified, uncertain]
    ClaimReview:
      type: object
      required: [target, outcome, rationale, evidence, reviewerId, reviewedAt]
      properties:
        target: { $ref: '#/components/schemas/ClaimTarget' }
        outcome: { $ref: '#/components/schemas/ReviewOutcome' }
        rationale: { type: string }
        evidence: { type: array, items: { type: string } }
        reviewerId: { type: string, format: uuid }
        reviewedAt: { type: string, format: date-time }
    ReviewRequest:
      type: object
      additionalProperties: false
      required: [target, outcome, rationale, evidence]
      description: Text is trimmed.
      properties:
        target: { $ref: '#/components/schemas/ClaimTarget' }
        outcome: { $ref: '#/components/schemas/ReviewOutcome' }
        rationale: { type: string, minLength: 1, maxLength: 4000 }
        evidence:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 500 }
    DecisionRequest:
      type: object
      additionalProperties: false
      required: [decision, note]
      properties:
        decision: { type: string, enum: [publish, return, reject] }
        note:
          type: string
          maxLength: 4000
          description: >-
            Trimmed and kept in the publication history. Must not be empty
            for `return` and `reject`.
    UnpublishRequest:
      type: object
      additionalProperties: false
      required: [note]
      properties:
        note:
          type: string
          maxLength: 4000
          description: Trimmed and kept in the publication history.
    PublicationLookup:
      type: object
      required: [contentId, publicationStatus]
      properties:
        contentId: { $ref: '#/components/schemas/ContentId' }
        publicationStatus: { $ref: '#/components/schemas/PublicationStatus' }
    MediaUpload:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: >-
            One file whose part Content-Type is `image/jpeg`, `image/png`,
            `image/webp`, `video/mp4` or `video/webm`. The filename is ignored.
        caption:
          type: string
          maxLength: 300
          description: Trimmed; empty means no caption.
    MediaRef:
      type: object
      required: [id, kind, mimeType, bytes, url, caption]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [image, video] }
        mimeType:
          type: string
          enum: [image/jpeg, image/png, image/webp, video/mp4, video/webm]
        bytes: { type: integer, minimum: 1 }
        url:
          type: string
          description: Gateway-relative, `/api/items/{id}/media/{mediaId}`.
        caption: { type: [string, 'null'] }
    ValidationIssue:
      type: object
      required: [field, reason]
      properties:
        field: { type: string }
        reason: { type: string }
    PublicError:
      type: object
      description: Safe to forward. Never carries stack traces, SQL or secrets.
      required: [code, message, requestId]
      properties:
        code:
          type: string
          examples:
            - VALIDATION_FAILED
            - UNAUTHENTICATED
            - SERVICE_UNAUTHENTICATED
            - FORBIDDEN
            - NOT_FOUND
            - ITEM_PUBLISHED
            - ITEM_NOT_PUBLISHED
            - SUBMISSION_NOT_PUBLISHABLE
            - CLAIMS_UNREVIEWED
            - RIGHTS_NOT_CONFIRMED
            - SUBMISSION_NOT_IN_REVIEW
            - SUBMISSION_REJECTED
            - MEDIA_LIMIT_REACHED
            - PAYLOAD_TOO_LARGE
            - UNSUPPORTED_MEDIA_TYPE
            - RANGE_NOT_SATISFIABLE
            - STORAGE_UNAVAILABLE
            - INTERNAL_ERROR
        message: { type: string }
        requestId: { type: string }
        details:
          type: array
          description: Only with `VALIDATION_FAILED`.
          items: { $ref: '#/components/schemas/ValidationIssue' }
